name: cpi-artifacts-production

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  REDIS_PREFIX: cpi-artifacts
  WEB_ORIGIN: https://${ARTIFACTS_DOMAIN}
  S3_INTERNAL_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://${ARTIFACTS_S3_DOMAIN}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-artifacts-quarantine}
  S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-artifacts-private}
  S3_EXPORT_BUCKET: ${S3_EXPORT_BUCKET:-artifacts-exports}
  S3_FORCE_PATH_STYLE: 'true'
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
    volumes:
      # PostgreSQL 18 stores data in a versioned subdirectory and requires the
      # volume at the parent path for safe pg_upgrade --link.
      - postgres_data:/var/lib/postgresql
      - ../postgres/init-runtime-user.sh:/docker-entrypoint-initdb.d/10-runtime-user.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --requirepass,
        '${REDIS_PASSWORD}',
        --maxmemory,
        96mb,
        --maxmemory-policy,
        noeviction,
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${ARTIFACTS_DOMAIN}
    volumes:
      - minio_data:/data
    networks:
      backend: {}
      caddy:
        aliases: [artifacts-minio]
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-artifacts-quarantine}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-artifacts-private}
      S3_EXPORT_BUCKET: ${S3_EXPORT_BUCKET:-artifacts-exports}
    entrypoint: [/bin/sh, /config/init.sh]
    volumes:
      - ../minio/init.sh:/config/init.sh:ro
      - ../minio/app-policy.json:/config/app-policy.json:ro
    networks: [backend]
    restart: 'no'
    mem_limit: 128m
    logging: *default-logging

  migrate:
    image: cpi-artifacts-tools:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_DIR: /app/packages/db/migrations
    command: [npm, run, db:migrate, -w, '@cpi/db']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: 'no'
    mem_limit: 256m
    logging: *default-logging

  seed:
    image: cpi-artifacts-tools:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_ADMIN_TELEGRAM_ID: ${SEED_ADMIN_TELEGRAM_ID:-}
    command: [npm, run, db:seed, -w, '@cpi/db']
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    restart: 'no'
    mem_limit: 192m
    logging: *default-logging

  api:
    image: cpi-artifacts-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      <<: *app-environment
      API_PORT: '3001'
      DEV_AUTH_ENABLED: 'false'
      SUPERADMIN_TELEGRAM_IDS: ${SUPERADMIN_TELEGRAM_IDS}
      SESSION_TTL_SECONDS: '604800'
      SESSION_COOKIE_NAME: cpi_artifacts_session
      COOKIE_DOMAIN: ${ARTIFACTS_DOMAIN}
      PRESIGNED_URL_TTL_SECONDS: '900'
      MULTIPART_THRESHOLD_BYTES: '20971520'
      MULTIPART_PART_SIZE_BYTES: '10485760'
      GLOBAL_MAX_FILE_SIZE_BYTES: '2147483648'
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      backend: {}
      caddy:
        aliases: [artifacts-api]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3001/health/live]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    logging: *default-logging

  worker:
    image: cpi-artifacts-worker:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      <<: *app-environment
      WORKER_HEALTH_PORT: '3003'
      FILE_VERIFICATION_MODE: ${FILE_VERIFICATION_MODE:-metadata-only}
      EXPORT_RETENTION_HOURS: '48'
      ABANDONED_UPLOAD_HOURS: '24'
      DELETED_OBJECT_RETENTION_DAYS: '30'
      WORKER_CONCURRENCY: '2'
    depends_on:
      seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3003/health/live]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    logging: *default-logging

  bot:
    image: cpi-artifacts-bot:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: bot
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PREFIX: cpi-artifacts
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEB_APP_URL: https://${ARTIFACTS_DOMAIN}
      BOT_MODE: webhook
      BOT_WEBHOOK_PATH: /telegram/webhook
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET}
      BOT_PORT: '3002'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      backend: {}
      caddy:
        aliases: [artifacts-bot]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3002/health/live]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 128
    logging: *default-logging

  web:
    image: cpi-artifacts-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_DEV_AUTH_ENABLED: 'false'
    depends_on:
      api:
        condition: service_healthy
    networks:
      caddy:
        aliases: [artifacts-web]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/web-health]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

networks:
  backend:
    internal: true
  caddy:
    external: true
    name: cpi-artifacts-caddy

volumes:
  postgres_data:
  redis_data:
  minio_data:
