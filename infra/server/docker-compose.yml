name: cpi-artifacts-production

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  REDIS_PREFIX: cpi-artifacts
  WEB_ORIGIN: https://${ARTIFACTS_DOMAIN}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_BASE: https://${ARTIFACTS_DOMAIN}/storage
  S3_REGION: ${S3_REGION:-ru1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_PREFIX: ${S3_PREFIX:-locker/}
  S3_FORCE_PATH_STYLE: 'true'
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  CRM_API_URL: ${CRM_API_URL}
  CRM_INTEGRATION_TOKEN: ${CRM_INTEGRATION_TOKEN}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
    volumes:
      # PostgreSQL 18 stores data in a versioned subdirectory and requires the
      # volume at the parent path for safe pg_upgrade --link.
      - postgres_data:/var/lib/postgresql
      - ../postgres/init-runtime-user.sh:/docker-entrypoint-initdb.d/10-runtime-user.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --requirepass,
        '${REDIS_PASSWORD}',
        --maxmemory,
        96mb,
        --maxmemory-policy,
        noeviction,
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    logging: *default-logging

  clamav:
    image: clamav/clamav:1.4_base
    environment:
      CLAMD_CONF_StreamMaxLength: ${CLAMAV_STREAM_MAX_LENGTH:-2048M}
      CLAMD_CONF_MaxFileSize: ${CLAMAV_MAX_FILE_SIZE:-2048M}
      CLAMD_CONF_MaxScanSize: ${CLAMAV_MAX_SCAN_SIZE:-2048M}
      CLAMD_CONF_AlertExceedsMax: 'yes'
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      backend: {}
      egress: {}
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 6m
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEMORY_LIMIT:-4g}
    pids_limit: 256
    logging: *default-logging

  migrate:
    image: cpi-artifacts-tools:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_DIR: /app/packages/db/migrations
    command: [npm, run, db:migrate, -w, '@cpi/db']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: 'no'
    mem_limit: 256m
    logging: *default-logging

  seed:
    image: cpi-artifacts-tools:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_ADMIN_TELEGRAM_ID: ${SEED_ADMIN_TELEGRAM_ID:-}
    command: [npm, run, db:seed, -w, '@cpi/db']
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    restart: 'no'
    mem_limit: 192m
    logging: *default-logging

  artifacts-api:
    image: cpi-artifacts-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      <<: *app-environment
      API_PORT: '3001'
      DEV_AUTH_ENABLED: 'false'
      SUPERADMIN_TELEGRAM_IDS: ${SUPERADMIN_TELEGRAM_IDS}
      SUPERADMIN_MAX_IDS: ${SUPERADMIN_MAX_IDS:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_AUTH_MAX_AGE_SECONDS: ${MAX_AUTH_MAX_AGE_SECONDS:-3600}
      LEADER_ID_ENABLED: ${LEADER_ID_ENABLED:-false}
      LEADER_ID_ENVIRONMENT: ${LEADER_ID_ENVIRONMENT:-production}
      LEADER_ID_CLIENT_ID: ${LEADER_ID_CLIENT_ID:-}
      LEADER_ID_CLIENT_SECRET: ${LEADER_ID_CLIENT_SECRET:-}
      LEADER_ID_SERVER_CLIENT_ID: ${LEADER_ID_SERVER_CLIENT_ID:-}
      LEADER_ID_SERVER_CLIENT_SECRET: ${LEADER_ID_SERVER_CLIENT_SECRET:-}
      LEADER_ID_TOKEN_ACTIVE_KEY_ID: ${LEADER_ID_TOKEN_ACTIVE_KEY_ID:-}
      LEADER_ID_TOKEN_KEYRING: ${LEADER_ID_TOKEN_KEYRING:-}
      LEADER_ID_OAUTH_SCOPE: ${LEADER_ID_OAUTH_SCOPE:-}
      LEADER_ID_OAUTH_STATE_TTL_SECONDS: ${LEADER_ID_OAUTH_STATE_TTL_SECONDS:-600}
      LEADER_ID_API_TIMEOUT_MS: ${LEADER_ID_API_TIMEOUT_MS:-10000}
      SESSION_TTL_SECONDS: '604800'
      SESSION_COOKIE_NAME: cpi_artifacts_session
      COOKIE_DOMAIN: ${ARTIFACTS_DOMAIN}
      PRESIGNED_URL_TTL_SECONDS: '900'
      MULTIPART_THRESHOLD_BYTES: '20971520'
      MULTIPART_PART_SIZE_BYTES: '10485760'
      GLOBAL_MAX_FILE_SIZE_BYTES: '2147483648'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      backend: {}
      caddy: {}
      egress: {}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3001/health/ready]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    logging: *default-logging

  worker:
    image: cpi-artifacts-worker:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      <<: *app-environment
      WORKER_HEALTH_PORT: '3003'
      FILE_VERIFICATION_MODE: ${FILE_VERIFICATION_MODE:-clamav}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      EXPORT_RETENTION_HOURS: '1'
      ABANDONED_UPLOAD_HOURS: '1'
      DELETED_OBJECT_RETENTION_DAYS: '0'
      WORKER_CONCURRENCY: '2'
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      backend: {}
      egress: {}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3003/health/ready]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 384m
    pids_limit: 128
    logging: *default-logging

  artifacts-bot:
    image: cpi-artifacts-bot:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: bot
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PREFIX: cpi-artifacts
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SUPERADMIN_TELEGRAM_IDS: ${SUPERADMIN_TELEGRAM_IDS}
      TELEGRAM_CATALYST_CHAT_INVITE_URL: ${TELEGRAM_CATALYST_CHAT_INVITE_URL:-}
      TELEGRAM_CATALYST_CHAT_ID: ${TELEGRAM_CATALYST_CHAT_ID:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
      MAX_WEBHOOK_PATH: ${MAX_WEBHOOK_PATH:-/max/webhook}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      WEB_APP_URL: https://${ARTIFACTS_DOMAIN}
      BOT_MODE: webhook
      BOT_WEBHOOK_PATH: /telegram/webhook
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET}
      CRM_API_URL: ${CRM_API_URL}
      CRM_INTEGRATION_TOKEN: ${CRM_INTEGRATION_TOKEN}
      BOT_PORT: '3002'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      backend: {}
      caddy: {}
      egress: {}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3002/health/live]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 128
    logging: *default-logging

  artifacts-web:
    image: cpi-artifacts-web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_DEV_AUTH_ENABLED: 'false'
    depends_on:
      artifacts-api:
        condition: service_healthy
    networks: [caddy]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/web-health]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

networks:
  backend:
    internal: true
  egress: {}
  caddy:
    external: true
    name: cpi-artifacts-caddy

volumes:
  clamav_data:
  postgres_data:
  redis_data:
